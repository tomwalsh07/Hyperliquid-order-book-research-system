[project]
name = "hlmicro"
version = "0.1.0"
description = "Hyperliquid perpetuals L2 order-book market-making research stack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=13.0",
    "aiohttp>=3.10",
    "pydantic>=2.8",
    "polars>=1.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "statsmodels>=0.14",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24.8",
]
notebook = [
    "jupyter>=1.1",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
